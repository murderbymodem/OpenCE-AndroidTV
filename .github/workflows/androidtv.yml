name: Android TV (armeabi-v7a)

# The 32-bit Android app (armeabi-v7a, port/android/README.md, "The 32-bit
# app") of this fork, for Android TV boxes whose Android runs only 32-bit apps.
#
# build: on each push to armeabi-v7a (and by hand), the release app,
# compiled with clang 22 so that the profiles in pgo/ optimise it, and the
# debug app (assertions checked, for finding problems), both signed with the
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets' key, are
# published as a release build-<n> holding halo-android-release.zip and
# halo-android-debug.zip, the newest marked latest: the app's self-updater
# (Updater.java) of the builds made here takes the one of its own kind from
# this repository. n is the run number
# plus 100, above the builds made by hand before this workflow. The last five
# are kept.
#
# sync: every day (and by hand, with the sync input), the main project's new commits on its main
# branch are merged into armeabi-v7a, so that this app stays able to play with
# the main project's (machines of different network versions do not play
# together: port/linux/include/halo_port_limits.h), and then built. A merge
# that conflicts is not pushed: the run fails with an error saying so (and
# opens an issue, where the repository has issues). GitHub's own token cannot
# push a merge that changes .github/workflows; the SYNC_TOKEN secret, a token
# with contents and workflows write access to this repository, can, and its
# pushes start the build themselves.
#
# The main project's own workflows (build.yml: every platform, its releases
# and its web site; server-image.yml) are for it: they stay in the branch, so
# that merging the main project's changes to them does not conflict, but are
# disabled here (Actions, the workflow, Disable workflow). This workflow runs
# only for armeabi-v7a; main is a mirror of the main project and builds
# nothing.
on:
  push:
    branches: [armeabi-v7a]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      sync:
        description: "Merge the main project's new commits first (then build)"
        type: boolean
        default: false
  schedule:
    - cron: "41 7 * * *"

concurrency:
  group: androidtv-${{ github.event_name == 'schedule' && 'sync' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/OpenCommunityEdition/OpenCE.git
  UPSTREAM_BRANCH: main
  BRANCH: armeabi-v7a

jobs:
  sync:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the main project's new commits
        id: merge
        run: |
          # a problem: the run's error (GitHub mails a failed scheduled run),
          # and an issue where the repository has issues (forks start without)
          report() {
            echo "::error title=$1::$(head -n 1 "$2")"
            if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ] &&
              [ -z "$(gh issue list --state open --search "\"$1\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$1" --body-file "$2" || true
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "already has every commit of the main project's $UPSTREAM_BRANCH"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")"
          if ! git merge --no-edit -m "Merge the main project's $UPSTREAM_BRANCH ($count new commits)" "upstream/$UPSTREAM_BRANCH"; then
            git merge --abort
            printf 'The daily sync could not merge %s new commits of %s (%s) into %s: they conflict with this fork'"'"'s changes.\n\nMerge them by hand (git fetch %s %s, git merge FETCH_HEAD, resolve, push).\n\nRun: %s\n' \
              "$count" "$UPSTREAM" "$UPSTREAM_BRANCH" "$BRANCH" "$UPSTREAM" "$UPSTREAM_BRANCH" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > issue.md
            report "Merging the main project's $UPSTREAM_BRANCH conflicts" issue.md
            exit 1
          fi
          if ! git push origin "HEAD:$BRANCH" 2> push.log; then
            cat push.log
            if grep -q "workflow" push.log; then
              printf 'The main project changed its workflows (.github/workflows), which GitHub'"'"'s own token cannot push.\n\nAdd a SYNC_TOKEN secret (a fine-grained token with Contents and Workflows read and write access to this repository), or merge %s %s into %s by hand.\n\nRun: %s\n' \
                "$UPSTREAM" "$UPSTREAM_BRANCH" "$BRANCH" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > issue.md
              report "The daily sync cannot push the main project's changes" issue.md
            fi
            exit 1
          fi
          echo "merged $count commits"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # (a push with GitHub's own token starts no workflow; one with
      # SYNC_TOKEN starts the build itself)
      - name: Build the merge
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_SYNC_TOKEN" != "true" ]; then
            gh workflow run androidtv.yml --ref "$BRANCH"
          fi

  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.sync) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # ninja, ccache, and clang 22 (LLVM's own packages), whose profiles in
      # pgo/ the guest is optimised with
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          curl -fsSL -o llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          clang-22 --version

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-androidtv-${{ github.sha }}
          restore-keys: ccache-androidtv-

      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::no ANDROID_KEYSTORE_BASE64 secret: a release signed with another key would not install over the app"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
          echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          echo "HALO_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Release build
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_ANDROID_ABIS: armeabi-v7a
          CI_ANDROID_GUEST_CC: clang-22
          CI_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          python3 tools/ci_build.py android release 2>&1 | tee build.log
          # (the guest's compiler only: configure.py also writes the Linux
          # build's rules, with the runner's own clang)
          if grep -q "^$CI_ANDROID_GUEST_CC is clang .*building without profile-guided optimisation" build.log; then
            echo "::warning::the guest was built without the profiles in pgo/"
          fi

      # (without the profiles and link-time optimisation, as the main
      # project's debug builds: tools/ci_build.py)
      - name: Debug build
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_ANDROID_ABIS: armeabi-v7a
          CI_ANDROID_GUEST_CC: clang-22
          CI_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: python3 tools/ci_build.py android debug

      - name: Check the apps
        run: |
          for apk in dist/halo-android-release/app-release.apk dist/halo-android-debug/app-debug.apk; do
            unzip -l "$apk" | grep -q "lib/armeabi-v7a/libmain.so"
            unzip -l "$apk" | grep -q "assets/halo_guest_armv7.elf"
            ! unzip -l "$apk" | grep -q "lib/arm64-v8a/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-release
          path: dist/halo-android-release
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-debug
          path: dist/halo-android-debug
          retention-days: 7

      # the release the self-updater looks for: tag build-<n>, the latest,
      # with halo-android-release.zip and halo-android-debug.zip (each app and
      # its licences)
      - name: Publish
        if: ${{ github.ref == 'refs/heads/armeabi-v7a' }}
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="build-$HALO_BUILD_NUMBER"
          (cd dist/halo-android-release && zip -qr "$GITHUB_WORKSPACE/halo-android-release.zip" .)
          (cd dist/halo-android-debug && zip -qr "$GITHUB_WORKSPACE/halo-android-debug.zip" .)
          subject="$(printf '%s' "${MESSAGE:-$(git log -1 --format=%s)}" | head -n 1)"
          network_version="$(sed -n 's/^#define HALO_PORT_NETWORK_VERSION \([0-9]*\).*/\1/p' port/linux/include/halo_port_limits.h)"
          printf '%s\n\nThe 32-bit Android app (armeabi-v7a) for Android TV boxes. Install halo-android-release.zip'"'"'s APK (adb install -r), or let the app update itself; halo-android-debug.zip'"'"'s app checks the game'"'"'s assertions, for reporting problems.\n\nCommit: %s\nBuild: %s\nNetwork version: %s\n' \
            "$subject" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$network_version" > notes.md
          gh release create "$tag" halo-android-release.zip halo-android-debug.zip --target "$GITHUB_SHA" --latest \
            --title "Build $HALO_BUILD_NUMBER (${GITHUB_SHA:0:7})" --notes-file notes.md

      - name: Keep the last five
        if: ${{ github.ref == 'refs/heads/armeabi-v7a' }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
